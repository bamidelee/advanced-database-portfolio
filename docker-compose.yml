services:
  postgres:
    image: postgres:16
    container_name: aquaflow-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aquaflow
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./:/portfolio

  redis:
    image: redis:7.2
    container_name: aquaflow-redis
    ports:
      - "6380:6379"
    volumes:
      - ./:/portfolio

  mongo:
    image: mongo:7.0
    container_name: aquaflow-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongodata:/data/db
      - ./:/portfolio

volumes:
  pgdata:
  mongodata: